name: semantic-layer

services:
  semantic-layer:
    image: semantic-layer:zed-baseline

    build:
      context: .
      dockerfile: Dockerfile
    
    runtime: nvidia
    privileged: true
    network_mode: host

    stdin_open: true
    tty: true

    working_dir: /workspace
    command: ["/bin/bash"]

    volumes:
      - ./workspace:/workspace
      - ./data/zed/resources:/usr/local/zed/resources
      - ./data/zed/settings:/usr/local/zed/settings
    