name: semantic-layer

services:
  zed-sdk:
    image: semantic-layer:zed-baseline

    build:
      context: .
      dockerfile: Dockerfile
    
    runtime: nvidia
    privileged: true
    network_mode: host
    ipc: host

    stdin_open: true
    tty: true

    volumes:
      - ./workspace:/workspace
      - ./data/zed/resources:/usr/local/zed/resources
      - ./data/zed/settings:/usr/local/zed/settings
    
    working_dir: /workspace
    command: ["bash", "-lc", "tail -f /dev/null"]